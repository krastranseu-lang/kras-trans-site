name: pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build site (self-hosted)
    runs-on: [self-hosted, macOS, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Create local venv (python3) & install libs
        run: |
          set -e
          python3 -V
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install --upgrade openpyxl beautifulsoup4 PyYAML pytest
          python -c 'import openpyxl, bs4, yaml, pytest; print("✅ libs OK")'

      - name: Cache Playwright browsers
        if: ${{ hashFiles('tests/**') != '' }}
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('**/requirements.txt') }}

      - name: Install Playwright (browser)
        if: ${{ hashFiles('tests/**') != '' }}
        run: |
          source .venv/bin/activate
          pip install --upgrade playwright
          python -m playwright install --with-deps chromium

      - name: Run tests
        if: ${{ hashFiles('tests/**') != '' }}
        run: |
          source .venv/bin/activate
          pytest -q

      # Jeśli chcesz tymczasowo ominąć test z Playwright:
      # run: |
      #   source .venv/bin/activate
      #   pytest -q -k 'not dropdown_keyboard'

      - name: Provide CMS (repo-only)
        run: |
          set -euo pipefail
          if [ ! -f data/cms/menu.xlsx ]; then
            echo "::error file=data/cms/menu.xlsx::Brak pliku CMS w repo. Wgraj data/cms/menu.xlsx i uruchom ponownie."
            exit 1
          fi
          ls -lh data/cms/menu.xlsx

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: CMS Schema Guard
        run: |
          set -euo pipefail
          source .venv/bin/activate
          mkdir -p _report
          python tools/cms_guard.py --strict data/cms/menu.xlsx > _report/cms_guard.txt

      - name: Generate CMS contract
        run: |
          source .venv/bin/activate
          python tools/explain_cms.py

      - name: Commit CMS contract (if changed)
        run: |
          if ! git diff --quiet -- docs/CMS-CONTRACT.md; then
            git config user.email "bot@kras-trans.com"
            git config user.name "KT Bot"
            git add docs/CMS-CONTRACT.md
            git commit -m "docs: refresh CMS contract"
          fi

      - name: Upload CMS sheet report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cms-sheets
          path: |
            sheet_report.json
            data/cms/menu.xlsx
            _report/cms_guard.txt
          if-no-files-found: warn

      - name: Build
        env:
          CLEAN: '1'
          MINIFY: '1'
        run: |
          set -e
          source .venv/bin/activate
          python tools/build.py
      - name: Verify build
        run: |
          set -e
          source .venv/bin/activate
          python tools/cms_verify_build.py
      - name: Upload page debug
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: page-debug
          path: _debug/page_*.json
          if-no-files-found: warn
      - name: Export routes diag
        if: ${{ always() }}
        run: |
          test -f dist/_routes.json && cp dist/_routes.json _routes.json || true
      - name: Upload routes diag
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: routes-json
          path: _routes.json
          if-no-files-found: warn
      - name: List bundles
        run: |
          echo "--- dist/assets/data/menu ---"; ls -lah dist/assets/data/menu || true
          echo "--- dist/assets/nav (legacy) ---"; ls -lah dist/assets/nav || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
