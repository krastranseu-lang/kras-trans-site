version: 6
languages: [pl, en, de, fr, it, ru, ua]
default_lang: pl
autogenerate_from_cms: true

# ============================ 1) CONSTANTS / KEYS ===========================
constants:
  SITE_URL: "https://kras-trans.com"
  GA_ID: "G-5FYE42J3BE"
  GSC_HTML_FILE: "google4377ff145fac0f52.html"
  GSC_VERIFICATION: "Q3XgXOegwnvV6sBj31MbGlldhfD2uzmHBnR6kvLFj7Y"
  BING_SITE_AUTH_USER: ""          # jeśli masz – wstaw; builder wygeneruje dist/BingSiteAuth.xml
  INDEXNOW_KEY: ""                 # jeśli masz – wstaw; builder wygeneruje /{key}.txt
  NEWS_ENABLED: false

# =============================== 2) SITE / I18N =============================
site:
  brand: "Kras-Trans"
  legalName: "Kras-Trans Sp. z o.o."
  url: "${SITE_URL}"
  defaultLang: "pl"
  locales:
    pl: { name: "Polski",  flag: "/assets/flags/pl.svg" }
    en: { name: "English", flag: "/assets/flags/en.svg" }
    de: { name: "Deutsch", flag: "/assets/flags/de.svg" }
    fr: { name: "Français",flag: "/assets/flags/fr.svg" }
    it: { name: "Italiano",flag: "/assets/flags/it.svg" }
    ru: { name: "Русский", flag: "/assets/flags/ru.svg" }
    ua: { name: "Українська", flag: "/assets/flags/ua.svg" }
  contacts:
    phone: "+48 793 927 467"
    email: "contact@kras-trans.eu"
    nip: "726 266 23 03"
    address: "ul. Trzcinowa 14/11, 91-495 Łódź, Polska"
    sameAs:
      - "https://www.instagram.com/kras_trans.express.eu?igsh=bHZkODhlazFicGt2&utm_source=qr"
      - "https://www.linkedin.com/company/kras-trans"
      - "https://www.facebook.com/share/sS2jgJPwdgvrF4az/?mibextid=LQQJ4d"
  analytics:
    ga4:
      measurement_id: "${GA_ID}"
      defer: true
      consent_mode_hook: true
  verification:
    google: "${GSC_VERIFICATION}"
    bing_wmt_meta: ""
    bing_site_auth_user: "${BING_SITE_AUTH_USER}"
  privacy:
    referrerPolicy: "strict-origin-when-cross-origin"

# =============================== 3) CMS SOURCE ==============================
cms:
  endpoint: ""
  key: ""
  expects:
    - ok
    - pages
    - routes
    - nav
    - strings
    - faq
    - places
    - autolinks
    - hreflang
    - sitemap
    - redirects
    - company
    - blocks
    - blog
  client:
    cache: false
    enforceLangRedirect: true

# ============================== 4) PATHS/ROUTING ============================
paths:
  src:  { templates: "templates", assets: "assets", data: "data", tools: "tools" }
  out:  "dist"

routing:
  locales_regex: "^(pl|en|de|fr|it|ru|ua)$"
  enforce_lang_prefix: false
  trailing_slash: true

# ============================== 5) TEMPLATES ================================
templates:
  base: "templates/base.html"
  header: "templates/header.html"
  page: "templates/page.html"
  location: "templates/location.html"
  blog_index: "templates/pages/blog.html"
  blog_post: "templates/pages/blog_post.html"
  reviews: "templates/reviews.html"
  jobs_index: "templates/jobs_index.html"
  job_item: "templates/job_item.html"

template_rules:
  by_type:
    home:        "templates/page.html"
    page:        "templates/page.html"
    service:     "templates/page.html"
    city_service: "templates/location.html"
    contact:     "templates/page.html"
    blog:        "templates/pages/blog.html"
    blog_post:   "templates/pages/blog_post.html"
    job:         "templates/job_item.html"
  by_slugKey:
    pricing: "templates/page.html"
    quote:   "templates/page.html"
    contact: "templates/page.html"
  by_slug_pattern:
    - { match: "^uslugi/.+$", template: "templates/page.html" }
    - { match: "^blog/.+$",   template: "templates/pages/blog_post.html" }

# =============================== PAGES ===============================
pages:
  - key: home
    slugKey: home
    lang: pl
    slug: ""
    type: home
    template: templates/page.html
  - key: home
    slugKey: home
    lang: en
    slug: ""
    type: home
    template: templates/page.html
  - key: home
    slugKey: home
    lang: de
    slug: ""
    type: home
    template: templates/page.html
  - key: home
    slugKey: home
    lang: fr
    slug: ""
    type: home
    template: templates/page.html
  - key: home
    slugKey: home
    lang: it
    slug: ""
    type: home
    template: templates/page.html
  - key: home
    slugKey: home
    lang: ru
    slug: ""
    type: home
    template: templates/page.html
  - key: home
    slugKey: home
    lang: ua
    slug: ""
    type: home
    template: templates/page.html

# =============================== ASSETS ===============================
assets:
  css:
    - "/assets/css/site.css"
  js:
    - "/assets/js/site.js"
    - "/assets/js/cms.js"
  js_late: []
  preload:
    - { as: "image", href: "/assets/media/logo-firma-transportowa-kras-trans.png", fetchpriority: "high" }
  flagsPath: "/assets/flags"
# ================================ 7) HEADER ================================
header:
  ctaSlugKey: "quote"
  hoverIntent: { open_ms: 140, close_ms: 380 }
  mega:
    columnsDefault: 4
    groups:
      services: { columns: 5, order: 60 }
      manage:   { columns: 4, order: 50 }
      company:  { columns: 3, order: 70 }
      support:  { columns: 3, order: 80 }
  dock:
    items:
      - slugKey: "home"
        icon: "🏠"
        labels: { pl:"Start", en:"Home", de:"Start", fr:"Accueil", it:"Home", ru:"Главная", ua:"Головна" }
      - slugKey: "services"
        icon: "🧭"
        labels: { pl:"Usługi", en:"Services", de:"Leistungen", fr:"Services", it:"Servizi", ru:"Услуги", ua:"Послуги" }
      - slugKey: "quote"
        icon: "💸"
        labels: { pl:"Wycena", en:"Quote", de:"Angebot", fr:"Devis", it:"Preventivo", ru:"Расчёт", ua:"Кошторис" }
      - slugKey: "contact"
        icon: "🤙"
        labels: { pl:"Kontakt", en:"Contact", de:"Kontakt", fr:"Contact", it:"Contatti", ru:"Контакты", ua:"Контакт" }

# ============================== 8) NAVIGATION ===============================
navigation:
  top:
    - { slugKey:"pricing",   order:10,  labels:{ pl:"Cennik", en:"Pricing", de:"Preise", fr:"Tarifs", it:"Prezzi", ru:"Цены", ua:"Ціни" } }
    - { slugKey:"order",     order:20,  labels:{ pl:"Zamów", en:"Order", de:"Auftrag", fr:"Commande", it:"Ordina", ru:"Заказ", ua:"Замовити" } }
    - { slugKey:"schedules", order:30,  labels:{ pl:"Harmonogramy", en:"Schedules", de:"Fahrpläne", fr:"Horaires", it:"Orari", ru:"Расписание", ua:"Розклади" } }
    - { slugKey:"tracking",  order:40,  labels:{ pl:"Śledzenie", en:"Tracking", de:"Verfolgung", fr:"Suivi", it:"Tracciamento", ru:"Отслеживание", ua:"Відстеження" } }
    - { slugKey:"manage",    order:50,  labels:{ pl:"Zarządzaj", en:"Manage", de:"Verwalten", fr:"Gérer", it:"Gestisci", ru:"Управлять", ua:"Керувати" } }
    - { slugKey:"services",  order:60,  labels:{ pl:"Usługi", en:"Services", de:"Leistungen", fr:"Services", it:"Servizi", ru:"Услуги", ua:"Послуги" } }
    - { slugKey:"company",   order:70,  labels:{ pl:"Firma", en:"Company", de:"Unternehmen", fr:"Entreprise", it:"Azienda", ru:"Компания", ua:"Компанія" } }
    - { slugKey:"support",   order:80,  labels:{ pl:"Wsparcie", en:"Support", de:"Support", fr:"Support", it:"Supporto", ru:"Поддержка", ua:"Підтримка" } }
    - { slugKey:"blog",      order:90,  labels:{ pl:"Blog", en:"Blog", de:"Blog", fr:"Blog", it:"Blog", ru:"Блог", ua:"Блог" } }
    - { slugKey:"contact",   order:100, labels:{ pl:"Kontakt", en:"Contact", de:"Kontakt", fr:"Contact", it:"Contatti", ru:"Контакты", ua:"Контакт" } }

# ============================== 9) EXTERNAL DATA ============================
sources:
  cities_csv:
    path: "assets/media/city.csv"
    dialect: "auto"
    map_columns:
      city:        ["city","miasto"]
      voivodeship: ["voivodeship","region","wojewodztwo","województwo"]
      slug:        ["slug","link"]
      lang:        ["lang","język","jezyk"]
  keywords_csv:
    path: "assets/media/slowa kluczowe.csv"
    dialect: "auto"
    map_columns:
      lang:   ["lang","jezyk","język"]
      term:   ["keyword","słowo","slowo","fraza"]
      type:   ["type","kategoria","rodzaj"]
      weight: ["weight","waga","priorytet"]
      anchor: ["anchor","tekst_linku"]

# ================================ 10) COLLECTIONS ===========================
collections:
  pages:
    source: "cms.pages"
    filter: { publish: true }
    perLocale: true
    templates:
      home:        "templates/page.html"
      page:        "templates/page.html"
      service:     "templates/page.html"
      city_service: "templates/location.html"
      contact:     "templates/page.html"
      blog:        "templates/pages/blog.html"
      blog_post:   "templates/pages/blog_post.html"
      job:         "templates/job_item.html"
    output: { pattern: "/{lang}/{slug}/", ensureTrailingSlash: true }
    seo:
      titleSuffix: " | Kras-Trans"
      canonicalFrom: "canonical_path"
      og_image_fallback: "/assets/media/og-default.webp"
      breadcrumbs: true
      hreflang: from-cms

  city_service:
    generate: true
    places:
      merge:
        - "cms.places"
        - "sources.cities_csv"
    services: "cms.pages[type=service]"
    langs: ["pl","en","de","fr","it","ru","ua"]
    limits: { perLang: 4000, maxPages: 20000 }   # 10k+ całkowicie realne
    slugPolicy: { pattern: "{service.slug}-{city.slug}", transliterate: true, lowercase: true }
    fields:
      type: "city_service"
      template: "templates/location.html"
      publish: true
      h1: "{service.h1} — {city.name}"
      title: "{service.title or service.h1} — {city.name}"
      seo_title: "{service.h1} — {city.name} | Kras-Trans"
      meta_desc: "Transport i spedycja — {service.h1} w {city.name}. Wycena w 15 min, kontakt 24/7."
      hero_alt: "{service.h1} {city.name}"
      lead: "{service.lead or service.title}"
    quality:
      thin_min_chars: 900
    linkGraph:
      neighbors: { byRegion: 3, altServices: 3 }   # zwiększamy zasięg dla 10k+
      cards:
        style: "tiles"
        explainer:
          enabled: true
          words: { min: 60, max: 90 }
          source:
            type: "cms.blocks"
            where: { type: "explainer", enabled: true }
            fields: { title: "title", body: "body_md", lang: "lang" }

blog:
  enabled: true
  pagination: { perPage: 12, path: "/{lang}/blog/page/{n}/", relPrevNext: true, page2_noindex: false }
  feeds: { rss: "/{lang}/feed.xml", atom: "/{lang}/atom.xml" }
  news_sitemap: { enabled: "${NEWS_ENABLED}", window_hours: 48 }

# ============================== 11) AUTOLINKS ===============================
autolinks:
  source: "cms.autolinks"     # anchor/href/lang/enabled (+ opcj. rel/target)
  inline:
    maxPerPage: 8             # lekko zwiększamy dla dużych treści
    minDistanceChars: 160
    boundary: "word"
    ignoreSelectors: [".hero","nav",".footer","h1","h2"]
  fallback:
    enabled: true
    limit: 6
    style: "cards"
    explainer:
      use_templates: false
      source:
        type: "cms.blocks"     # wyłącznie z arkusza
        where: { type: "explainer", enabled: true }
        fields: { title: "title", body: "body_md", lang: "lang" }
      words: { min: 60, max: 90 }

# =============================== 12) KEYWORDS ===============================
