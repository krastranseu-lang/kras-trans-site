<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Van Pack – widget demo v8</title>
    <style>
      /* ===================== THEME TOKENS ===================== */
      .vp {
        --bg: #0f1117;
        --ink: #e8eef9;
        --muted: #9fb0ca;
        --accent: #ff5a00;
        --accent-ink: #fff;
        --ok: #1fcf6d;
        --bad: #ff4d4f;
        --line: #223047;
        --card: #121a2b;
        --soft: #1a2236;
        --rad: 14px;
        --gap: 12px;
        --grid: 5;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial,
          sans-serif;
        color: var(--ink);
      }
      @media (prefers-color-scheme: light) {
        .vp:not([data-theme="dark"]) {
          --bg: #f5f7fb;
          --ink: #141a2a;
          --muted: #5b6a85;
          --accent: #ef5a00;
          --accent-ink: #fff;
          --ok: #0f9b5f;
          --bad: #d43030;
          --line: #d5dcef;
          --card: #ffffff;
          --soft: #f0f3fa;
        }
      }
      .vp[data-theme="light"] {
        --bg: #f5f7fb;
        --ink: #141a2a;
        --muted: #5b6a85;
        --accent: #ef5a00;
        --accent-ink: #fff;
        --ok: #0f9b5f;
        --bad: #d43030;
        --line: #d5dcef;
        --card: #ffffff;
        --soft: #f0f3fa;
      }

      /* ===================== BASE ===================== */
      .vp * {
        box-sizing: border-box;
      }
      .vp a {
        color: var(--accent);
      }
      .vp .vp-wrap {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--rad);
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        max-width: 1400px;
        margin: 0 auto;
      }
      .vp .topbar {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .vp .title {
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .vp .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 10px;
      }
      .vp select,
      .vp input[type="number"],
      .vp input[type="text"],
      .vp input[type="date"],
      .vp input[type="time"],
      .vp textarea {
        background: #0c1322;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
      }
      .vp[data-theme="light"] select,
      .vp[data-theme="light"] input,
      .vp[data-theme="light"] textarea {
        background: #fff;
      }
      .vp label {
        color: var(--muted);
        font-size: 0.95rem;
      }
      .vp .chip {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      /* Theme toggle */
      .vp .theme {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .vp .toggle {
        width: 62px;
        height: 28px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: var(--soft);
        position: relative;
        cursor: pointer;
      }
      .vp .knob {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #ffd166;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
      }
      .vp[data-theme="light"] .knob {
        transform: translateX(34px);
        background: #ffe08a;
      }
      .vp[data-theme="dark"] .knob {
        transform: translateX(0);
      }
      /* Grid */
      .vp .grid {
        display: grid;
        grid-template-columns: minmax(240px, 1fr) 400px;
        gap: 16px;
      }
      @media (max-width: 1120px) {
        .vp .grid {
          grid-template-columns: 1fr;
        }
      }

      /* Stage */
      .vp .stage-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--rad);
        padding: 10px;
        position: relative;
      }
      .vp .stage-wrap {
        position: relative;
        width: 100%;
        height: 560px;
      }
      @media (min-width: 1400px) {
        .vp .stage-wrap {
          height: 640px;
        }
      }
      .vp svg {
        width: 100%;
        height: 100%;
        display: block;
        background: linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.02),
            rgba(255, 255, 255, 0) 30%
          ),
          var(--soft);
        border-radius: 10px;
      }
      .vp .board {
        outline: 1px solid #2b3958;
      }
      .vp .gridline {
        stroke: #26334e;
        stroke-width: 0.2;
      }
      .vp[data-theme="light"] .gridline {
        stroke: #e8eef9;
      }
      .vp .hull {
        fill: #0e1526;
        stroke: #3a4d77;
        stroke-width: 0.8;
      }
      .vp[data-theme="light"] .hull {
        fill: #f2f5fb;
        stroke: #d5dcef;
      }
      /* HUD overlay for readable labels */
      .vp .hud-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .vp .hud {
        position: absolute;
        padding: 2px 4px;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1;
        color: var(--ink);
        background: rgba(0, 0, 0, 0.25);
      }
      .vp[data-theme="light"] .hud {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      .vp .item {
        fill: #2a3b60;
        stroke: #83a1ff;
        stroke-width: 0.7;
        cursor: grab;
      }
      .vp[data-theme="light"] .item {
        fill: #cdd7f7;
        stroke: #4a77ff;
      }
      .vp .dragging .item.selected {
        cursor: grabbing;
      }
      .vp .item.collide {
        stroke: var(--bad);
      }
      .vp .item.selected {
        filter: drop-shadow(0 0 10px rgba(90, 163, 255, 0.6));
      }
      .vp .label {
        font-size: 3.2px;
        fill: #d7e3ff;
        paint-order: stroke;
        stroke: #0b1020;
        stroke-width: 0.6;
      }
      .vp .rotBtn {
        fill: #0c1322;
        stroke: #83a1ff;
        stroke-width: 0.5;
        cursor: pointer;
      }
      .vp .rotHit {
        fill: transparent;
        pointer-events: all;
        cursor: pointer;
      }

      /* Underbar */
      .vp .underbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px dashed #2b3958;
        margin-top: 10px;
      }
      .vp .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--accent);
        color: var(--accent-ink);
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .vp .btn.secondary {
        background: var(--soft);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .vp .btn.ghost {
        background: transparent;
        border: 1px dashed var(--line);
      }

      /* Side */
      .vp .side {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--rad);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: relative;
      }
      .vp .side h4 {
        margin: 0;
        font-size: 1rem;
        color: #d7e3ff;
      }
      .vp[data-theme="light"] .side h4 {
        color: #1a2233;
      }
      .vp .preset-list {
        display: grid;
        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 8px;
      }
      .vp .preset {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
      }
      .vp .preset small {
        color: var(--muted);
      }
      .vp .qty {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .vp .qty input {
        width: 64px;
      }

      /* Bulk */
      .vp .bulk {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
      }
      .vp .bulk .out {
        background: #0c1322;
        border: 1px dashed #33425f;
        border-radius: 8px;
        padding: 8px;
        min-height: 40px;
        color: #c9d6f0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      .vp[data-theme="light"] .bulk .out {
        background: #fff;
        color: #2b3b55;
        border-color: #cfd8ef;
      }
      .vp .note {
        color: var(--muted);
        font-size: 0.9rem;
      }

      /* Custom small form */
      .vp .custom {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .vp .custom .row {
        display: flex;
        flex-direction: column;
      }
      .vp .custom .wide {
        grid-column: 1 / -1;
      }

      /* Add vehicle */
      .vp .vehbox {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
      }
      .vp .vehgrid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      @media (max-width: 560px) {
        .vp .vehgrid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .vp .meters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .vp .meters .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
      }
      progress {
        width: 100%;
        height: 10px;
      }
      progress::-webkit-progress-value {
        background: var(--accent);
      }
      progress::-webkit-progress-bar {
        background: #23314d;
      }
      .vp[data-theme="light"] progress::-webkit-progress-bar {
        background: #e8eef9;
      }

      .vp .status {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .vp .badge {
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 600;
      }
      .vp .badge.ok {
        background: rgba(31, 207, 109, 0.12);
        color: #0be481;
        border: 1px solid #1fcf6d;
      }
      .vp .badge.bad {
        background: rgba(255, 77, 79, 0.12);
        color: #ff4d4f;
        border: 1px solid #ff4d4f;
      }

      .vp .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .vp details {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
      }

      /* Selected item panel */
      .vp .selected-panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        display: none;
      }
      .vp .selected-panel.active {
        display: block;
      }
      .vp .selected-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      /* Modal */
      .vp .modal {
        position: fixed;
        inset: 0;
        background: rgba(5, 8, 15, 0.66);
        display: none;
        align-items: center;
        justify-content: center;
      }
      .vp .modal[open] {
        display: flex;
      }
      .vp .modal .box {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        width: min(900px, 96vw);
      }
      .vp .modal h3 {
        margin-top: 0;
      }
      .vp .modal .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .vp .modal input,
      .vp .modal textarea {
        width: 100%;
        background: #0c1322;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
      }
      .vp[data-theme="light"] .modal input,
      .vp[data-theme="light"] .modal textarea {
        background: #fff;
        color: #111;
      }
      .vp .modal .foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 10px;
      }

      /* Focus & a11y */
      .vp [tabindex]:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Error box */
      .vp .error {
        background: #2b1111;
        color: #ffd7d7;
        border: 1px solid #7a2b2b;
        border-radius: 10px;
        padding: 10px;
        display: none;
      }
      .vp .error[aria-hidden="false"] {
        display: block;
      }

      /* Fancy checkbox (stackable) */
      .vp .chk {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--soft);
        cursor: pointer;
        user-select: none;
      }
      .vp .chk input {
        appearance: none;
        width: 16px;
        height: 16px;
        border: 1px solid #41527a;
        border-radius: 4px;
        display: inline-block;
        background: #0c1322;
        position: relative;
      }
      .vp .chk input:checked {
        background: #0d2418;
        border-color: #2a9d6f;
      }
      .vp .chk input:checked::after {
        content: "";
        position: absolute;
        inset: 2px;
        background: #2dd07a;
        border-radius: 2px;
      }
      .vp .chk span {
        color: var(--muted);
      }
    </style>
  </head>

          const deepClone = (obj) => JSON.parse(JSON.stringify(obj));

          function cm3ToM3(c) {
            return c / 1_000_000;
          }
          function volItem(it) {
            return cm3ToM3(it.L * it.W * it.H) * it.stackCount;
          }
          function weightItem(it) {
            return (it.weight || 0) * it.stackCount;
          }
          function dims2D(it) {
            const rotated = it.rot % 2 !== 0;
            return rotated ? { l: it.W, w: it.L } : { l: it.L, w: it.W };
          }
          function within(it, veh) {
            const { l, w } = dims2D(it);
            return (
              it.x >= 0 &&
              it.y >= 0 &&
              it.x + l <= veh.inner_cm.L &&
              it.y + w <= veh.inner_cm.W
            );
          }
          function overlap(a, b) {
            const A = dims2D(a),
              B = dims2D(b);
            return (
              a.x < b.x + B.l &&
              a.x + A.l > b.x &&
              a.y < b.y + B.w &&
              a.y + A.w > b.y
            );
          }
          function anyCollision(it, exceptId) {
            return state.items.some((x) => x.id !== exceptId && overlap(it, x));
          }
          function snap(v) {
            const g = vehicle().grid_cm;
            return Math.round(v / g) * g;
          }
          function meters(cm) {
            return cm / 100;
          }
          function ldmOf(it, veh) {
            const { l, w } = dims2D(it);
            return (
              meters(l) * (meters(w) / meters(veh.inner_cm.W)) * it.stackCount
            );
          }

          function pushHistory() {
            state.history.push(
              deepClone({
                items: state.items,
                vehicleIndex: state.vehicleIndex,
              })
            );
            if (state.history.length > 50) state.history.shift();
            state.future.length = 0;
          }
          function undo() {
            const last = state.history.pop();
            if (!last) return;
            state.future.push(
              deepClone({
                items: state.items,
                vehicleIndex: state.vehicleIndex,
              })
            );
            state.items = deepClone(last.items);
            state.vehicleIndex = last.vehicleIndex;
            state.selectedId = null;
            renderAll();
          }
          function redo() {
            const next = state.future.pop();
            if (!next) return;
            pushHistory();
            state.items = deepClone(next.items);
            state.vehicleIndex = next.vehicleIndex;
            state.selectedId = null;
            renderAll();
          }

              if (s) {
                state.vehicleIndex = s.v || 0;
                state.items = s.items || [];
                lang = s.lang || lang;
                const th = s.theme || theme;

                    theme: mount.getAttribute("data-theme"),

            const url = location.origin + location.pathname + "#vp=" + data;
            navigator.clipboard?.writeText(url);
            alert("Link skopiowany do schowka.");
          }
          function loadFromHash() {
            const m = location.hash.match(/#vp=([^&]+)/);
            if (!m) return false;
            try {
              const obj = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
              state.vehicleIndex = obj.v || 0;
              state.items = obj.items || [];
              lang = obj.lang || lang;
              if (obj.theme) setTheme(obj.theme);
              return true;
            } catch {
              return false;
            }
          }
          function toSvgPoint(evt) {
            const pt = board.createSVGPoint();
            pt.x = evt.clientX;
            pt.y = evt.clientY;
            const sp = pt.matrixTransform(board.getScreenCTM().inverse());
            return { x: sp.x, y: sp.y };
          }

          // ===================== SVG =====================
          function buildSVG() {
            const v = vehicle();
            board.setAttribute(
              "viewBox",
              `0 0 ${v.inner_cm.L} ${v.inner_cm.W}`
            );
            board.innerHTML = "";
            hudLayer.innerHTML = "";
            const gGrid = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "g"
            );
            const step = v.grid_cm;
            for (let x = 0; x <= v.inner_cm.L; x += step) {
              const line = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
              );
              line.setAttribute("x1", x);
              line.setAttribute("y1", 0);
              line.setAttribute("x2", x);
              line.setAttribute("y2", v.inner_cm.W);
              line.setAttribute("class", "gridline");
              gGrid.appendChild(line);
            }
            for (let y = 0; y <= v.inner_cm.W; y += step) {
              const line = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
              );
              line.setAttribute("x1", 0);
              line.setAttribute("y1", y);
              line.setAttribute("x2", v.inner_cm.L);
              line.setAttribute("y2", y);
              line.setAttribute("class", "gridline");
              gGrid.appendChild(line);
            }
            board.appendChild(gGrid);
            const hull = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "rect"
            );
            hull.setAttribute("x", 0);
            hull.setAttribute("y", 0);
            hull.setAttribute("width", v.inner_cm.L);
            hull.setAttribute("height", v.inner_cm.W);
            hull.setAttribute("rx", 3);
            hull.setAttribute("class", "hull");
            board.appendChild(hull);
            const gItems = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "g"
            );
            gItems.setAttribute("id", "gItems");
            board.appendChild(gItems);

          function renderItems() {
            const g = board.querySelector("#gItems");
            g.innerHTML = "";
            hudLayer.innerHTML = "";
            const rect = board.getBoundingClientRect();
            const v = vehicle();
            const sx = rect.width / v.inner_cm.L,
              sy = rect.height / v.inner_cm.W;
            state.items.forEach((it) => {
              const { l, w } = dims2D(it);
              const r = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "rect"
              );
              r.setAttribute("x", it.x);
              r.setAttribute("y", it.y);
              r.setAttribute("width", l);
              r.setAttribute("height", w);
              r.setAttribute("rx", 1.5);
              r.setAttribute(
                "class",
                "item" + (state.selectedId === it.id ? " selected" : "")
              );
              r.setAttribute("data-id", it.id);
              r.setAttribute("tabindex", "0");

              const label = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
              );
              label.setAttribute("x", it.x + 2.5);
              label.setAttribute("y", it.y + 5.5);
              label.setAttribute("class", "label dimLabel");
              label.textContent = `${it.L}×${it.W}${
                it.stackCount > 1 ? " ×" + it.stackCount : ""

              const bx = it.x + l - 3.5,
                by = it.y + 3.5;
              const rbHit = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
              );
              rbHit.setAttribute("cx", bx);
              rbHit.setAttribute("cy", by);
              rbHit.setAttribute("r", 7);
              rbHit.setAttribute("class", "rotHit");
              rbHit.setAttribute("data-rot", it.id);
              const rb = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"

              rb.setAttribute("cy", by);
              rb.setAttribute("r", 3.2);
